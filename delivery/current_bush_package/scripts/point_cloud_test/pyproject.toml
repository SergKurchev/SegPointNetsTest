[project]
name = "point-cloud-test"
version = "0.1.0"
description = "Multiview RGB-D point cloud dataset builder and evaluation helpers for strawberry segmentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
  "opencv-python>=4.10.0",
  "pandas>=2.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"
